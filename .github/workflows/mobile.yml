name: Mobile
on:
  push:
    branches: main
  workflow_dispatch:

  workflow_call:
    inputs:
      buildFlags:
        required: false
        type: string

jobs:
  Mobile:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK & NDK
        if: startsWith(matrix.os, 'ubuntu')
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          ndk: r27c

      - name: Install Libraries
        run: |
          haxelib install hscript --quiet
          haxelib install hmm --quiet
          haxelib run hmm install --quiet

      - name: Configure Android
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          haxelib run lime config ANDROID_SDK ${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          haxelib run lime config ANDROID_NDK_ROOT ${ANDROID_NDK_ROOT:-${RUNNER_TEMP}/android-ndk-r27c}
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Compile (Android)
        if: startsWith(matrix.os, 'ubuntu')
        run: haxelib run lime build android ${{ inputs.buildFlags != '' && format('-D {0}', inputs.buildFlags) || '' }}

      - name: Compile (iOS)
        if: startsWith(matrix.os, 'macos')
        run: haxelib run lime build ios -nosign ${{ inputs.buildFlags != '' && format('-D {0}', inputs.buildFlags) || '' }}

      - name: Make Ipa
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install ldid
          cd build/release/ios/build/Release-iphoneos/FNF-Phoenix-Engine.app
          ldid -S../../../FNF-Phoenix-Engine/FNF-Phoenix-Engine.entitlements FNF-Phoenix-Engine || true
          cd ..
          mkdir -p Payload
          mv FNF-Phoenix-Engine.app Payload
          zip -r FNF-Phoenix-Engine.ipa Payload

      - name: Upload Artifact (Android)
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: androidBuild
          path: build/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Artifact (iOS)
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: iOSBuild
          path: |
            FNF-Phoenix-Engine.ipa
            build/release/ios/build/Release-iphoneos/*.ipa
          if-no-files-found: error
