name: Mobile
on:
  push:
    branches: main
  workflow_dispatch:
    inputs:
      buildAllTargets:
        description: "Build all targets"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      buildFlags:
        required: false
        type: string
      buildAllTargets:
        description: "Build all targets"
        required: false
        type: boolean
        default: false

jobs:
  Mobile:
    runs-on: ${{matrix.os}}
    if: ${{ startsWith(matrix.os, 'ubuntu') || inputs.buildAllTargets == true || inputs.buildAllTargets == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6

      - name: Setup Android NDK
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          cd ${{ runner.temp }}
          echo "Downloading Android NDK r27c..."
          curl -sSfL -o android-ndk.zip "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"
          echo "Extracting Android NDK r27c..."
          unzip -qq android-ndk.zip
          echo "NDK r27c successfully downloaded and extracted!"

      - name: Install Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install --quiet

      - name: Configure Android
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ runner.temp }}/android-ndk-r27c
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Compile (Android)
        if: startsWith(matrix.os, 'ubuntu')
        run: haxelib run lime build android ${{ inputs.buildFlags != '' && format('-D {0}', inputs.buildFlags) || '' }}

      - name: Compile (iOS)
        if: startsWith(matrix.os, 'macos')
        run: haxelib run lime build ios -nosign ${{ inputs.buildFlags != '' && format('-D {0}', inputs.buildFlags) || '' }}

      - name: Make Ipa
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install ldid
          cd build/release/ios/build/Release-iphoneos/FNF-Phoenix-Engine.app
          ldid -S../../../FNF-Phoenix-Engine/FNF-Phoenix-Engine.entitlements FNF-Phoenix-Engine
          cd ..
          mkdir Payload
          mv FNF-Phoenix-Engine.app Payload
          zip -r FNF-Phoenix-Engine.ipa Payload

      - name: Upload Artifact (Android)
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: androidBuild
          path: build/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Artifact (iOS)
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: iOSBuild
          path: build/release/ios/build/Release-iphoneos/*.ipa
          if-no-files-found: error
