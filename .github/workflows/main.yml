name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      buildFlags:
        required: false
        type: string
  workflow_dispatch:

# Keep the haxelib installation inside the workspace so it can be restored on
# subsequent runs instead of downloading and compiling dependencies every time.
env:
  HAXELIB_PATH: ${{ github.workspace }}/.haxelib
  # Must be named HXCPP_COMPILE_CACHE - that's the variable hxcpp itself reads
  # to enable its object cache. Renaming this back to anything else silently
  # disables caching (no error, it just never gets used).
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache
  # -D HXCPP_OPTIMIZE_LINK turns on LTO / whole-program optimization
  # (-flto on mac, /GL+LTCG on MSVC, respected on Linux too). This is the
  # actual cross-platform performance knob hxcpp exposes; there's no plain
  # -O3 define for native gcc/clang/MSVC builds (only the mingw toolchain has
  # that shortcut, which isn't what's used here). Trade-off: link times go up.
  HXCPP_PERF_FLAGS: "-D HXCPP_OPTIMIZE_LINK"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: linux
            target_dir: linux
            cache_name: linux
            artifact: linuxBuild
            artifact_path: build/release/linux/bin
            setup: unix
          - name: Windows
            os: windows-latest
            target: windows
            target_dir: windows
            cache_name: windows
            artifact: windowsBuild
            artifact_path: build/release/windows/bin
            setup: windows
          - name: macOS (Intel)
            os: macos-15
            target: mac
            target_dir: macos
            target_args: -64 -D HXCPP_M64
            cache_name: macos-intel
            artifact: macBuild-intel
            artifact_path: build/release/macos/bin
            setup: unix
          - name: macOS (ARM)
            os: macos-15
            target: mac
            target_dir: macos
            target_args: -arm64 -D HXCPP_ARM64
            cache_name: macos-arm
            artifact: macBuild-arm
            artifact_path: build/release/macos/bin
            setup: unix

    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      # The old cache targeted build/release, but Lime writes to export/release.
      # A dependency-only key makes the expensive haxelib and hxcpp setup reusable.
      # Restore-only here; the matching save step (below, after compile) runs
      # with if: always() so a later build failure doesn't cost us this cache.
      - name: Restore haxelib and hxcpp tools
        id: haxelib-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.HAXELIB_PATH }}
          key: haxelib-${{ runner.os }}-haxe-4.3.7-${{ hashFiles('hmm.json', 'setup/unix.sh', 'setup/windows.bat') }}

      - name: Install Linux packages
        if: matrix.setup == 'unix' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libgl-dev libx11-dev libxi-dev libxpm-dev libxrandr-dev libncurses-dev libvlc-dev libvlccore-dev

      - name: Install haxelib dependencies (Unix)
        if: matrix.setup == 'unix' && steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          haxelib setup "$HAXELIB_PATH"
          chmod +x ./setup/unix.sh
          SKIP_SYSTEM_DEPENDENCIES=1 ./setup/unix.sh

      - name: Install haxelib dependencies (Windows)
        if: matrix.setup == 'windows' && steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          haxelib setup "%HAXELIB_PATH%"
          call setup\windows.bat

      - name: Ensure MSVC hxcpp git checkout (Windows)
        if: matrix.setup == 'windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File setup\windows-msvc-fix.ps1

      - name: Compile hxcpp tools (Unix)
        if: matrix.setup == 'unix' && steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd "$HAXELIB_PATH/hxcpp/git/tools/run" && haxe compile.hxml
          cd "$HAXELIB_PATH/hxcpp/git/tools/hxcpp" && haxe compile.hxml

      - name: Compile hxcpp tools (Windows)
        if: matrix.setup == 'windows' && steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd /d "%HAXELIB_PATH%\hxcpp\git\tools\run" && haxe compile.hxml
          cd /d "%HAXELIB_PATH%\hxcpp\git\tools\hxcpp" && haxe compile.hxml

      - name: Save haxelib and hxcpp tools
        if: always() && steps.haxelib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.HAXELIB_PATH }}
          key: ${{ steps.haxelib-cache.outputs.cache-primary-key }}

      # Restore the most recent generated C++ files even when the source hash
      # changes. Lime/hxcpp then recompiles only the files affected by the change.
      - name: Restore generated C++ cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/release/${{ matrix.target_dir }}/haxe
            build/release/${{ matrix.target_dir }}/obj
            ${{ env.HXCPP_COMPILE_CACHE }}
          key: hxcpp-${{ runner.os }}-${{ matrix.cache_name }}-${{ inputs.buildFlags || 'commit' }}-${{ hashFiles('project.hxp', 'source/**') }}
          restore-keys: |
            hxcpp-${{ runner.os }}-${{ matrix.cache_name }}-${{ inputs.buildFlags || 'commit' }}-
            hxcpp-${{ runner.os }}-${{ matrix.cache_name }}-

      - name: Compile (Unix)
        if: matrix.setup == 'unix'
        shell: bash
        env:
          HXCPP_COMPILE_THREADS: 4
        run: |
          # The restored compile cache carries a PCH built against headers
          # from a previous haxelib checkout; the restored haxelib headers
          # may have different mtimes. clang then refuses the PCH and fails
          # the build; drop it so it is regenerated against the real headers.
          rm -f assets/preload/gameRenders/renderlol.bat
          find "$HXCPP_COMPILE_CACHE" -name '*.pch' -delete 2>/dev/null || true
          haxelib run lime build ${{ matrix.target }} ${{ matrix.target_args }} -D"${{ inputs.buildFlags || 'commit' }}" ${{ env.HXCPP_PERF_FLAGS }}

      - name: Compile (Windows)
        if: matrix.setup == 'windows'
        shell: pwsh
        env:
          HXCPP_COMPILE_THREADS: $env:NUMBER_OF_PROCESSORS
        run: |
          if (Test-Path $env:HXCPP_COMPILE_CACHE) { Get-ChildItem $env:HXCPP_COMPILE_CACHE -Recurse -Filter *.pch | Remove-Item -Force }
          Remove-Item -Force assets/preload/gameRenders/renderlinux.sh
          haxelib run lime build windows -D"${{ inputs.buildFlags || 'commit' }}" ${{ env.HXCPP_PERF_FLAGS }}

      - name: Save generated C++ cache
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/release/${{ matrix.target_dir }}/haxe
            build/release/${{ matrix.target_dir }}/obj
            ${{ env.HXCPP_COMPILE_CACHE }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
