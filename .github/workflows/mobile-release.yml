name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      buildAllTargets:
        description: "Build all targets"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  get-latest-tag:
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.get_tag.outputs.LATEST_TAG }}
    steps:
      - name: Get latest release tag
        id: get_tag
        run: |
          latest_tag=$(curl --silent "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r .tag_name)
          echo "Latest tag is $latest_tag"
          echo "LATEST_TAG=$latest_tag" >> $GITHUB_OUTPUT

  build:
    name: Build
    uses: ./.github/workflows/mobile.yml
    with:
      buildFlags: officialBuild
      buildAllTargets: ${{ github.event.inputs.buildAllTargets == 'true' || github.event.inputs.buildAllTargets == true }}

  release-android:
    name: Release androidBuild
    needs: [get-latest-tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: androidBuild
      - name: Locate APK
        run: |
          apk_path=$(find . -name "*.apk" | head -n 1)
          echo "APK_PATH=$apk_path" >> $GITHUB_ENV
      - name: Upload androidBuild to release
        uses: svenstaro/upload-release-action@2.5.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.get-latest-tag.outputs.latest_tag }}
          file: ${{ env.APK_PATH }}
          asset_name: FNF-Phoenix-Engine-android.apk
          overwrite: false

  release-ios:
    name: Release iOSBuild
    needs: [get-latest-tag, build]
    if: ${{ github.event.inputs.buildAllTargets == 'true' || github.event.inputs.buildAllTargets == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: iOSBuild
      - name: Zip For Release
        run: |
          if [ -f "FNF-Phoenix-Engine.ipa" ]; then
            zip -r FNF-Phoenix-Engine-iOS.zip FNF-Phoenix-Engine.ipa
          else
            # try to find any ipa and zip it
            ipa=$(find . -name "*.ipa" | head -n 1)
            if [ -n "$ipa" ]; then
              zip -r FNF-Phoenix-Engine-iOS.zip "$ipa"
            else
              echo "No IPA found to zip" >&2
              exit 1
            fi
          fi
      - name: Upload iOSBuild to release
        uses: svenstaro/upload-release-action@2.5.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.get-latest-tag.outputs.latest_tag }}
          file: FNF-Phoenix-Engine-iOS.zip
          asset_name: FNF-Phoenix-Engine-iOS.zip
          overwrite: false
